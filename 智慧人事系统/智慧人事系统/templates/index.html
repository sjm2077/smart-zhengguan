{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>智慧人事系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-building-columns"></i></div>
      <div class="title"><h2>智慧人事系统</h2><span></span></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">© 2026 · 人事处</div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div class="topbar-left">
        <button class="topbar-toggle" id="sidebarToggle" title="折叠侧边栏">
          <svg viewBox="0 0 16 16" fill="none">
            <line x1="2" y1="4" x2="14" y2="4"/>
            <line x1="2" y1="8" x2="14" y2="8"/>
            <line x1="2" y1="12" x2="14" y2="12"/>
          </svg>
        </button>
        <div class="topbar-brand-text">
          <span class="brand-zh">山东大学政治学与公共管理学院</span>
          <span class="brand-en">School of Political Science and Public Administration, SDU</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-search-wrapper" id="globalSearchWrapper">
          <div class="topbar-search">
            <svg viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-opacity="0.7" stroke-width="1.5"/><line x1="10" y1="10" x2="14" y2="14" stroke="white" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="text" id="searchInput" placeholder="全局搜索姓名、工号、手机、邮箱、部门...">
          </div>
          <div class="search-suggestions" id="searchSuggestions" style="display:none;"></div>
        </div>
        <button class="topbar-icon-btn" id="notifyBtn" title="通知">
          <svg viewBox="0 0 17 17" fill="none"><path d="M8.5 2a4 4 0 0 0-4 4v3.5L3 11v1h11v-1l-1.5-1.5V6a4 4 0 0 0-4-4z" stroke="white" stroke-opacity="0.7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.8 13a1.6 1.6 0 0 0 3.2 0" stroke="white" stroke-opacity="0.7" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="notify-dot"></span>
        </button>
        <div class="topbar-user">
          <div class="user-avatar">管</div>
          <div class="user-info-text">
            <span class="user-name">系统管理员</span>
            <span class="user-role">平台管理</span>
          </div>
        </div>
      </div>
    </header>
    <div class="content-area" id="contentArea"></div>
  </main>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="{% static 'js/data.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
