
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0a1f44, #0d2a4d);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 60px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      max-width: 600px;
    }
    .icon { font-size: 80px; margin-bottom: 30px; }
    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #00d4ff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.8;
    }
    .badge {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(0, 212, 255, 0.2);
      border-radius: 20px;
      margin-top: 30px;
      font-size: 14px;
      color: #00d4ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>教学管理系统</h1>
    <p>
      本模块用于管理教务相关业务，包括：<br>
      课程安排、教学计划、学生成绩、教室资源等<br>
      由其他团队开发的子系统页面将嵌入此处
    </p>
    <div class="badge">页面加载中，请稍候...</div>
  </div>
  <script>
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'auth') {
        console.log('收到认证信息:', e.data.payload);
      }
    });
  </script>
</body>
</html>
