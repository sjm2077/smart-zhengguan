      // ================== 仪表盘 ==================
      function renderPieChart(data, colors, title) {
        const total = data.reduce((sum, d) => sum + d.value, 0);
        if (total === 0) return '<p>暂无数据</p>';
        const cx = 100, cy = 100, r = 80;
        let cumulativeAngle = 0;
        let paths = '';
        data.forEach((item, i) => {
          const sliceAngle = (item.value / total) * 2 * Math.PI;
          const startAngle = cumulativeAngle;
          const endAngle = cumulativeAngle + sliceAngle;
          cumulativeAngle = endAngle;
          const x1 = cx + r * Math.cos(startAngle);
          const y1 = cy + r * Math.sin(startAngle);
          const x2 = cx + r * Math.cos(endAngle);
          const y2 = cy + r * Math.sin(endAngle);
          const largeArc = sliceAngle > Math.PI ? 1 : 0;
          const pathData = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
          paths += `<path d="${pathData}" fill="${colors[i]}" stroke="#fff" stroke-width="1.5"/>`;
        });
        let legend = data.map((d, i) =>
          `<div style="display:flex;align-items:center;gap:6px;font-size:0.85rem;margin-top:6px;">
            <span style="width:14px;height:14px;background:${colors[i]};border-radius:4px;"></span>
            ${d.label}：${d.value}人 (${((d.value/total)*100).toFixed(1)}%)
          </div>`).join('');
        return `<div class="card"><div class="card-header"><h3><i class="fas fa-chart-pie"></i> ${title}</h3></div>
          <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
            <svg viewBox="0 0 200 200" style="width:180px;height:180px;flex-shrink:0;">${paths}</svg>
            <div style="flex:1;min-width:150px;">${legend}</div>
          </div></div>`;
      }

      function renderDonutChart(data, colors, title) {
        const total = data.reduce((sum, d) => sum + d.value, 0);
        if (total === 0) return '<p>暂无数据</p>';
        const cx = 100, cy = 100, outerR = 75, innerR = 45;
        let cumulativeAngle = 0;
        let paths = '';
        data.forEach((item, i) => {
          const sliceAngle = (item.value / total) * 2 * Math.PI;
          const startAngle = cumulativeAngle;
          const endAngle = cumulativeAngle + sliceAngle;
          cumulativeAngle = endAngle;
          const x1Outer = cx + outerR * Math.cos(startAngle);
          const y1Outer = cy + outerR * Math.sin(startAngle);
          const x2Outer = cx + outerR * Math.cos(endAngle);
          const y2Outer = cy + outerR * Math.sin(endAngle);
          const x1Inner = cx + innerR * Math.cos(startAngle);
          const y1Inner = cy + innerR * Math.sin(startAngle);
          const x2Inner = cx + innerR * Math.cos(endAngle);
          const y2Inner = cy + innerR * Math.sin(endAngle);
          const largeArc = sliceAngle > Math.PI ? 1 : 0;
          const pathData = `M ${x1Outer} ${y1Outer} A ${outerR} ${outerR} 0 ${largeArc} 1 ${x2Outer} ${y2Outer} L ${x2Inner} ${y2Inner} A ${innerR} ${innerR} 0 ${largeArc} 0 ${x1Inner} ${y1Inner} Z`;
          paths += `<path d="${pathData}" fill="${colors[i]}" stroke="#fff" stroke-width="1.5"/>`;
        });
        let centerText = `<text x="100" y="95" text-anchor="middle" fill="#0b2b5a" font-weight="bold" font-size="16">总人数</text>
                          <text x="100" y="115" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="22">${total}</text>`;
        let legend = data.map((d, i) =>
          `<div style="display:flex;align-items:center;gap:6px;font-size:0.85rem;margin-top:6px;">
            <span style="width:14px;height:14px;background:${colors[i]};border-radius:50%;"></span>
            ${d.label}：${d.value}人
          </div>`).join('');
        return `<div class="card"><div class="card-header"><h3><i class="fas fa-circle-notch"></i> ${title}</h3></div>
          <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
            <svg viewBox="0 0 200 200" style="width:180px;height:180px;flex-shrink:0;">${paths}${centerText}</svg>
            <div style="flex:1;min-width:150px;">${legend}</div>
          </div></div>`;
      }

      function renderDashboard() {
        const total = personnelData.length;
        const active = personnelData.filter(p => !p.retireInfo.isRetired).length;
        const retired = personnelData.filter(p => p.retireInfo.isRetired).length;
        const partyMembers = personnelData.filter(p => p.politicalStatus === '中共党员').length;

        const assessCounts = { '优秀': 0, '合格': 0, '基本合格': 0, '不合格': 0 };
        personnelData.forEach(p => {
          p.annualAssessments.forEach(a => {
            if (assessCounts[a.result] !== undefined) assessCounts[a.result]++;
          });
        });
        const assessLabels = Object.keys(assessCounts);
        const maxAssess = Math.max(...Object.values(assessCounts), 1);
        let barHtml = '';
        const barColors = ['#2563eb', '#10b981', '#f59e0b', '#ef4444'];
        assessLabels.forEach((label, idx) => {
          const val = assessCounts[label];
          const heightPercent = (val / maxAssess) * 100;
          barHtml += `<div class="bar-item">
            <span style="font-weight:600;font-size:0.85rem;color:#1e293b;">${val}次</span>
            <div class="bar" style="height:${Math.max(heightPercent, 6)}%; background:linear-gradient(180deg, ${barColors[idx]}cc, ${barColors[idx]}); width:36px;"></div>
            <span class="bar-label">${label}</span>
          </div>`;
        });

        const politicsMap = {};
        personnelData.forEach(p => {
          const status = p.politicalStatus || '群众';
          politicsMap[status] = (politicsMap[status] || 0) + 1;
        });
        const politicsData = Object.entries(politicsMap).map(([label, value]) => ({ label, value }));
        const politicsColors = ['#2563eb', '#8b5cf6', '#f59e0b', '#10b981', '#ec4899'];
        const pieChartHtml = renderPieChart(politicsData, politicsColors, '政治面貌分布');

        const staffingMap = {};
        personnelData.forEach(p => {
          const type = p.staffingType.type || '未知';
          staffingMap[type] = (staffingMap[type] || 0) + 1;
        });
        const staffingData = Object.entries(staffingMap).map(([label, value]) => ({ label, value }));
        const staffingColors = ['#0ea5e9', '#6366f1', '#14b8a6', '#f43f5e'];
        const donutHtml = renderDonutChart(staffingData, staffingColors, '编制类型构成');

        return `
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon" style="background:#2563eb;"><i class="fas fa-user-group"></i></div><div><div class="stat-value">${total}</div><div class="stat-label">教职工总数</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#10b981;"><i class="fas fa-user-check"></i></div><div><div class="stat-value">${active}</div><div class="stat-label">在职人数</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#f59e0b;"><i class="fas fa-person-cane"></i></div><div><div class="stat-value">${retired}</div><div class="stat-label">离退休</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:#8b5cf6;"><i class="fas fa-flag"></i></div><div><div class="stat-value">${partyMembers}</div><div class="stat-label">党员人数</div></div></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px; margin-bottom:18px;">
            ${pieChartHtml}
            ${donutHtml}
          </div>
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-chart-bar"></i> 年度考核分布</h3></div>
            <div class="bar-chart" style="gap: 32px; justify-content: center; padding: 10px 0;">${barHtml}</div>
          </div>
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-clock-rotate-left"></i> 最近动态</h3></div>
            <ul style="list-style:none;padding-left:0;">
              <li style="padding:8px 0;">📌 张振国 2025年度考核优秀</li>
              <li style="padding:8px 0;">📌 孙立 调入大数据研究院</li>
              <li style="padding:8px 0;">📌 王建国 于2025年2月退休</li>
            </ul>
          </div>`;
      }

      // ================== 表格相关 ==================
      function renderSimpleTable(type, columns, rowMapper) {
        let rows = personnelData.map(p => rowMapper(p)).filter(r => r);
        return generateTableHTML(columns, rows);
      }

      function renderListTable(field, columns, rowMapper) {
        let rows = [];
        personnelData.forEach(p => {
          const list = p[field];
          if (list && list.length > 0) {
            list.forEach(item => rows.push(rowMapper(p, item)));
          }
        });
        return generateTableHTML(columns, rows);
      }

      function generateTableHTML(columns, rows) {
        let html = `<div class="card"><div class="card-header"><h3>${pageTitles[currentPage] || ''}</h3>
          <button class="btn btn-outline" onclick="window.exportTable()"><i class="fas fa-download"></i> 导出</button>
        </div><div class="table-responsive"><table><thead><tr>`;
        columns.forEach(col => html += `<th>${col}</th>`);
        html += `<th>操作</th></tr></thead><tbody>`;
        rows.forEach(row => {
          html += '<tr>';
          row.forEach((cell, idx) => {
            if (idx === 1) {
              const personId = personnelData.find(p => p.name === cell)?.id || '';
              html += `<td><span class="clickable-name" data-id="${personId}">${cell}</span></td>`;
            } else {
              html += `<td>${cell}</td>`;
            }
          });
          html += `<td><button class="btn btn-outline" style="padding:4px 12px;" onclick="window.showDetailById('${personnelData.find(p=>p.name===row[1])?.id||''}')"><i class="fas fa-eye"></i> 详情</button></td>`;
          html += '</tr>';
        });
        html += '</tbody></table></div></div>';
        return html;
      }

        const rows = personnelData.map(p => [p.id, p.name, p.gender, p.birthdate, p.nation, p.nativePlace, p.idCard]);
        return generateTableHTML(columns, rows);

          <h4>工作经历</h4>${p.workList.map(w=>`<p>${w.company} ${w.position} (${w.start}~${w.end})</p>`).join('') || '<p>无</p>'}
          <h4>家庭成员</h4>${p.familyMembers.map(f=>`<p>${f.name} (${f.relation}) ${f.workplace}</p>`).join('') || '<p>无</p>'}
          <h4>年度考核</h4>${p.annualAssessments.map(a=>`<span style="margin-right:12px;">${a.year}:${a.result}</span>`).join('') || '无'}
          <h4>荣誉称号</h4>${p.honors.map(h=>`<p>${h.name} (${h.grantor},${h.date})</p>`).join('') || '<p>无</p>'}
        `;
        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('modalOverlay').style.display = 'flex';
      }

      window.closeModal = function() { document.getElementById('modalOverlay').style.display = 'none'; };
      window.showDetailById = function(id) { if(id) showDetailModal(id); };
      window.exportTable = function() {
        const toast = document.getElementById('toast');
        toast.textContent = '✅ 表格导出成功！（模拟）';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
      };

      // ================== 绩效统计 ==================
      function renderPerformanceStats() {
        const sorted = [...personnelData].sort((a,b) => b.performanceScore - a.performanceScore);
        const maxScore = Math.max(...sorted.map(p => p.performanceScore), 1);
        const barHeight = 30, gap = 12, topPadding = 20, leftPadding = 80, chartWidth = 500;
        const svgHeight = sorted.length * (barHeight + gap) + topPadding + 20;
        let barsSvg = '';
        sorted.forEach((p, idx) => {
          const y = topPadding + idx * (barHeight + gap);
          const barWidth = (p.performanceScore / maxScore) * (chartWidth - leftPadding - 60);
          const color = p.performanceScore >= 85 ? '#2563eb' : (p.performanceScore >= 70 ? '#6366f1' : '#f59e0b');
          barsSvg += `<rect x="${leftPadding}" y="${y}" width="${barWidth}" height="${barHeight}" rx="6" fill="${color}" />`;
          barsSvg += `<text x="${leftPadding-10}" y="${y+barHeight/2+5}" text-anchor="end" font-size="12" fill="#1e293b">${p.name}</text>`;
          barsSvg += `<text x="${leftPadding+barWidth+5}" y="${y+barHeight/2+5}" font-size="12" fill="#0f2b4b">${p.performanceScore}</text>`;
        });

        const bubbleSvgWidth = 500, bubbleSvgHeight = 350;
        const xMax = Math.max(...personnelData.map(p => p.teachingScore));
        const yMax = Math.max(...personnelData.map(p => p.researchScore));
        const rMax = Math.max(...personnelData.map(p => p.serviceScore));
        let bubblesSvg = '';
        personnelData.forEach(p => {
          const cx = 40 + (p.teachingScore / xMax) * (bubbleSvgWidth - 80);
          const cy = bubbleSvgHeight - 30 - (p.researchScore / yMax) * (bubbleSvgHeight - 60);
          const r = 8 + (p.serviceScore / rMax) * 20;
          const color = p.performanceScore >= 85 ? '#2563eb' : (p.performanceScore >= 70 ? '#6366f1' : '#f59e0b');
          bubblesSvg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="0.7" stroke="#fff" stroke-width="2"/>`;
          bubblesSvg += `<text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="10" fill="#1e293b">${p.name}</text>`;
        });
        const axisStyle = 'stroke="#94a3b8" stroke-width="1"';
        const xAxisY = bubbleSvgHeight - 25;
        bubblesSvg += `<line x1="30" y1="${xAxisY}" x2="${bubbleSvgWidth-10}" y2="${xAxisY}" ${axisStyle}/>`;
        bubblesSvg += `<line x1="30" y1="10" x2="30" y2="${xAxisY}" ${axisStyle}/>`;
        bubblesSvg += `<text x="${bubbleSvgWidth/2}" y="${bubbleSvgHeight-5}" text-anchor="middle" font-size="12" fill="#475569">教学得分</text>`;
        bubblesSvg += `<text x="15" y="${bubbleSvgHeight/2}" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90,15,${bubbleSvgHeight/2})">科研得分</text>`;

        return `
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-chart-bar"></i> 绩效得分排序</h3></div>
            <div class="chart-container">
              <svg viewBox="0 0 ${chartWidth} ${svgHeight}" style="width:100%; max-width:600px; height:auto;">${barsSvg}</svg>
            </div>
            <div class="chart-note">
              <strong>📊 图表说明：</strong>绩效得分基于教学、科研、服务三个维度的加权综合计算（权重分别为0.4、0.4、0.2）。条形图按总分降序排列，颜色越深表示绩效越高（≥85蓝色，≥70青色，其余橙色），可快速定位高绩效与需关注的对象。
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-circle-dot"></i> 多维度绩效气泡图（X:教学 Y:科研 大小:服务）</h3></div>
            <div class="chart-container">
              <svg viewBox="0 0 ${bubbleSvgWidth} ${bubbleSvgHeight}" style="width:100%; max-width:600px; height:auto;">${bubblesSvg}</svg>
            </div>
            <div class="chart-note">
              <strong>📈 图表说明：</strong>每个气泡代表一位教师，横轴为教学得分，纵轴为科研得分，气泡半径代表服务得分。颜色含义同绩效条形图。通过分布可观察教师在多维度上的特长与短板，例如科研强而教学弱，或各方面均衡发展。
            </div>
          </div>`;
      }

      // ================== 晋升预测 ==================
      function renderPromotionPrediction() {
        const activeStaff = personnelData.filter(p => !p.retireInfo.isRetired);
        const years = [2020,2021,2022,2023,2024,2025];

        // 构建热力图表格
        let heatmapTable = '<table class="heatmap-table"><thead><tr><th>教师</th>';
        years.forEach(y => heatmapTable += `<th>${y}</th>`);
        heatmapTable += '</tr></thead><tbody>';
        activeStaff.forEach(p => {
          heatmapTable += `<tr><td style="font-weight:500;">${p.name}</td>`;
          p.promotionHistory.forEach(h => {
            const prob = h.prob;
            let bgColor;
            if (prob >= 0.8) bgColor = '#2563eb';
            else if (prob >= 0.6) bgColor = '#6366f1';
            else if (prob >= 0.4) bgColor = '#f59e0b';
            else if (prob > 0) bgColor = '#ef4444';
            else bgColor = '#e2e8f0';
            const textColor = prob > 0.5 ? 'white' : '#1e293b';
            heatmapTable += `<td style="background:${bgColor}; color:${textColor}; font-weight:600;">${prob.toFixed(2)}</td>`;
          });
          heatmapTable += '</tr>';
        });
        heatmapTable += '</tbody></table>';

        const lineSvgWidth = 500, lineSvgHeight = 300;
        const lineColors = ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];
        let linesSvg = '';
        const xStep = (lineSvgWidth-60) / (years.length-1);
        const yRange = lineSvgHeight - 50;
        linesSvg += `<line x1="40" y1="${lineSvgHeight-30}" x2="${lineSvgWidth-10}" y2="${lineSvgHeight-30}" stroke="#94a3b8" stroke-width="1"/>`;
        linesSvg += `<line x1="40" y1="10" x2="40" y2="${lineSvgHeight-30}" stroke="#94a3b8" stroke-width="1"/>`;
        years.forEach((yr, i) => {
          const x = 40 + i * xStep;
          linesSvg += `<text x="${x}" y="${lineSvgHeight-10}" text-anchor="middle" font-size="11" fill="#475569">${yr}</text>`;
        });
        activeStaff.forEach((p, idx) => {
          const points = p.promotionHistory.map((h, i) => {
            const x = 40 + i * xStep;
            const y = lineSvgHeight-30 - (h.prob / 1.0) * yRange;
            return `${x},${y}`;
          });
          const color = lineColors[idx % lineColors.length];
          linesSvg += `<polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
          linesSvg += `<circle cx="${lineSvgWidth-80}" cy="${15+idx*18}" r="5" fill="${color}"/>`;
          linesSvg += `<text x="${lineSvgWidth-70}" y="${19+idx*18}" font-size="11" fill="#1e293b">${p.name}</text>`;
        });

        return `
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-table-cells"></i> 晋升可能性热力图（年份 × 教师）</h3></div>
            <div class="chart-container">${heatmapTable}</div>
            <div class="chart-note">
              <strong>🔥 热力图说明：</strong>数值为预测晋升概率（0~1），基于历史绩效、科研产出、教学评价等指标通过机器学习模型估算。颜色越深（蓝）表示晋升可能性越高，黄色/红色代表中等或较低，灰色为0（已退休或不符合条件）。可直观识别潜力人才与需帮扶对象。
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3><i class="fas fa-chart-line"></i> 历年晋升概率变化趋势</h3></div>
            <div class="chart-container">
              <svg viewBox="0 0 ${lineSvgWidth} ${lineSvgHeight}" style="width:100%; max-width:700px; height:auto;">${linesSvg}</svg>
            </div>
            <div class="chart-note">
              <strong>📉 折线图说明：</strong>展示每位在职教师自2020年至2025年的晋升概率变化轨迹。上升趋势表明教师发展良好，下降或波动可能反映近期表现下滑或政策影响。可用于长期发展规划与针对性支持决策。
            </div>
          </div>`;
      }

      // ================== 事件绑定与初始化 ==================
      document.getElementById('searchInput').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase().trim();
        document.querySelectorAll('table tbody tr').forEach(row => {
          row.style.display = row.innerText.toLowerCase().includes(keyword) ? '' : 'none';
        });
      });

      function bindEvents() {
        document.getElementById('sidebarNav').addEventListener('click', function(e) {
          const target = e.target.closest('.nav-item');
          if (!target) return;
          const page = target.getAttribute('data-page');
          const parent = target.getAttribute('data-parent');
          if (target.classList.contains('parent-menu')) {
            toggleSubmenu(target.getAttribute('data-parent'));
            return;
          }
          if (page) {
            renderPage(page, parent || null);
            if (parent) document.getElementById('sub_' + parent).classList.add('open');
          }
        });
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
          if (e.target === this) closeModal();
        });
      }

      renderSidebar();
      bindEvents();
      renderPage('dashboard');
    })();
  </script>
</body>
</html>
